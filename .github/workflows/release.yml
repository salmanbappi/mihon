name: Official Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    name: Build & Public Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Bump Version
        run: ./scripts/bump_version.sh

      - name: Commit and Push Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${{ env.NEW_VN }}"
          git push origin master

      - name: Build Release APK
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > release.jks
          ./gradlew assembleRelease -Pinclude-telemetry=false -Penable-updater=false --no-daemon
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          VERSION="${{ env.NEW_VN }}"
          cd app/build/outputs/apk/release/
          for f in *.apk; do
            mv "$f" "Mihon-v$VERSION-$f"
          done

      - name: Generate Detailed Context for AI
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="-n 10"
          else
            RANGE="$PREV_TAG..HEAD"
          fi
          
          mkdir -p .github/ai
          # 1. Get commits (subjects and bodies)
          git log $RANGE --pretty=format:"- %s%n%b" | grep -v "chore: bump version" > .github/ai/commits.txt || echo "New version release." > .github/ai/commits.txt
          
          # 2. Get file change statistics
          git diff --stat $RANGE > .github/ai/files.txt
          
          # 3. Get actual code diff (capped at 200 lines for stability)
          git diff -U1 $RANGE | head -n 200 > .github/ai/diff.txt

      - name: Format Changelog with Groq AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          COMMITS=$(cat .github/ai/commits.txt)
          FILES=$(cat .github/ai/files.txt)
          DIFF=$(cat .github/ai/diff.txt)
          
          cat > .github/ai/full_prompt.txt <<EOF
          You are an excited team member of Mihon! Write a friendly and hyped 'Changelog' for our fans. 
          Summarize WHAT IS NEW and WHAT CHANGED based on the commits and diff below.
          Use emojis like 🚀, ✨, and 🛠️. Group into 'What's New', 'Fixed', and 'Polished'.
          CRITICAL: Do NOT mention technical terms like 'code', 'commits', or 'diff'. Focus on improvements!
          If the diff is truncated, rely on the commit history to tell the story.
          
          NEW CHANGES:
          COMMITS:
          $COMMITS

          FILE STATS:
          $FILES
          
          DIFF SNIPPET:
          $DIFF
          EOF
          
          PAYLOAD=$(jq -n \
            --rawfile prompt .github/ai/full_prompt.txt \
            --arg model "llama-3.3-70b-versatile" \
            '{
              model: $model,
              messages: [{role: "user", content: $prompt}],
              temperature: 0.7,
              max_tokens: 1024
            }')
          
          echo "Requesting AI summary from Groq (llama-3.3-70b-versatile)..."
          RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          # Debug: Log the response status/error (excluding full body if successful)
          ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR_MSG" ]; then
            echo "Groq API Error: $ERROR_MSG"
          else
            echo "Groq API Request: Success"
          fi
          
          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          
          if [ -z "$SUMMARY" ] || [ "$SUMMARY" == "null" ]; then
            SUMMARY="We've made some secret improvements under the hood to make your experience better! ✨"
          fi
          
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.NEW_VN }}
          name: Mihon Release v${{ env.NEW_VN }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## 🚀 Mihon v${{ env.NEW_VN }}
            
            ${{ env.CHANGELOG }}
            
            ---
            **📥 Download:** Choose the `arm64-v8a` version for your phone.
